<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css"
      integrity="sha384-PsH8R72JQ3SOdhVi3uxftmaW6Vc51MKb0q5P2rRUpPvrszuE4W1povHYgTpBfshb"
      crossorigin="anonymous"
    />
    <style>
      #loading,
      #results {
        display: none;
      }
    </style>

    <title>Safelock Calculator</title>
  </head>
  <body class="bg-white">
    <div class="container">
      <div class="row">
        <div class="col-md-6 mx-auto">
          <div
            class="card card-body text-center mt-5"
            style="box-shadow: 0 26px 30px -14px rgba(0,102,245,0.08);"
          >
            <h1
              style="font-size: 0.8em !important;"
              class="heading display-5 pb-3"
              id="savings-name"
            ></h1>
            <form id="loan-form">
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-addon">₦</span>
                  <input
                    type="number"
                    class="form-control"
                    id="amount"
                    value="125000"
                    autofocus
                    placeholder="Enter an amount..."
                  />
                </div>
              </div>
              <div hidden>
                <label for="amount">Interest Rate</label>
                <div class="form-group">
                  <div class="input-group">
                    <span class="input-group-addon">%</span>
                    <input
                      disabled="disabled"
                      type="number"
                      class="form-control"
                      id="interest"
                      value="10"
                    />
                  </div>
                </div>
              </div>
              <div hidden>
                <!-- <label for="amount">How Many Days Are You Saving For?</label> -->
                <div class="form-group">
                  <input
                    type="number"
                    class="form-control"
                    id="years"
                    min="90"
                    placeholder="For How Many Days?"
                  />
                </div>
              </div>
              <div class="form-group">
                <input
                  type="submit"
                  value="Calculate"
                  class="btn btn-dark btn-block"
                />
              </div>
            </form>

            <!-- Loader Here -->

            <div id="loading">
              <img src="img/loading.gif" alt="" />
            </div>

            <!-- Results -->
            <div id="results" class="pt-4">
              <h5>Results</h5>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-addon">Future Value</span>
                  <input class="form-control" id="future-value" disabled />
                </div>
              </div>

              <div class="form-group" hidden>
                <div class="input-group">
                  <span class="input-group-addon">Total Saved</span>
                  <input
                    type="number"
                    class="form-control"
                    id="total-payment"
                    disabled
                  />
                </div>
              </div>

              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-addon">Interest Earned</span>
                  <input class="form-control" id="total-interest" disabled />
                </div>
              </div>
              <input
                id="cal-again"
                type="submit"
                hidden
                value="Calculate Another"
                class="btn btn-dark btn-block"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
